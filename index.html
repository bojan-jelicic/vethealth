    <meta name="theme-color" content="#2B5AA0" />
    <style>
      #app-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#fff;z-index:9999}
      #app-loader .ring{position:relative;width:168px;height:168px;display:flex;align-items:center;justify-content:center}
      #app-loader .ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #EEF4FB;border-top-color:#2B5AA0;border-right-color:#86B6E4;animation:vl-spin 1.1s linear infinite}
      #app-loader img{width:120px;height:120px;object-fit:contain;animation:vl-pulse 1.8s ease-in-out infinite}
      #app-loader .dots{display:flex;gap:8px}
      #app-loader .dots span{width:9px;height:9px;border-radius:50%;background:#2B5AA0;animation:vl-bounce 1.2s ease-in-out infinite}
      #app-loader .dots span:nth-child(2){background:#86B6E4;animation-delay:.15s}
      #app-loader .dots span:nth-child(3){background:#F5B82E;animation-delay:.3s}
      @keyframes vl-spin{to{transform:rotate(360deg)}}
      @keyframes vl-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @keyframes vl-bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
      @media (prefers-reduced-motion:reduce){#app-loader *,#app-loader .ring::before{animation:none!important}}
    </style>
  </head>

  <body>
    <div id="root"><div id="app-loader" role="status" aria-label="Učitavanje"><div class="ring"><img src="/favicon.png" alt="VEThealth" /></div><div class="dots"><span></span><span></span><span></span></div></div></div>
